# Quarkus ArC Bean Indexing for Generated Kafka Client
quarkus.index-dependency.quarkus-kafka.group-id=com.asyncapi
quarkus.index-dependency.quarkus-kafka.artifact-id=quarkus-kafka

# Kafka test configuration
kafka.bootstrap.servers=kafka:19092
%test.kafka.bootstrap.servers=kafka:19092

# Connect to the topics from asyncapi-adeo.yml
mp.messaging.incoming.consumer-channel.connector=smallrye-kafka
mp.messaging.incoming.consumer-channel.topic=adeo-dev-case-study-COSTING-REQUEST-V1
mp.messaging.incoming.consumer-channel.auto.offset.reset=earliest

mp.messaging.outgoing.producer-channel.connector=smallrye-kafka
mp.messaging.outgoing.producer-channel.topic=adeo-dev-case-study-COSTING-RESPONSE-V1
