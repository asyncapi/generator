# Quarkus ArC Bean Indexing for Generated Kafka Client
quarkus.index-dependency.quarkus-kafka.group-id=com.asyncapi
quarkus.index-dependency.quarkus-kafka.artifact-id=quarkus-kafka

# Kafka broker configuration for testing container
kafka.bootstrap.servers=kafka:19092

# Test-only outgoing channel to send messages to the consumer topic
mp.messaging.outgoing.test-costing-request-producer.connector=smallrye-kafka
mp.messaging.outgoing.test-costing-request-producer.topic=adeo-dev-case-study-COSTING-REQUEST-V1
mp.messaging.outgoing.test-costing-request-producer.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.test-costing-request-producer.value.serializer=org.apache.kafka.common.serialization.StringSerializer
