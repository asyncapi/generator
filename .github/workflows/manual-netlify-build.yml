name: Docs Preview Build (Netlify)

on:
  pull_request:
    paths:
      - 'apps/generator/docs/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout generator PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Checkout website repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: asyncapi/website
          ref: master
          path: website
          fetch-depth: 1
          persist-credentials: false

      - name: Sync docs into website
        run: |
          rm -rf website/markdown/docs/tools/generator/*
          cp -R apps/generator/docs/* website/markdown/docs/tools/generator/
          rm -f website/markdown/docs/tools/generator/README.md
          rm -rf website/markdown/docs/tools/generator/jsdoc2md-handlebars
          printf "%s\ntitle: Generator\nweight: 3\n%s" "---" "---"> website/markdown/docs/tools/generator/_section.md

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'

      - name: Install deps
        working-directory: website
        run: npm ci --ignore-scripts

      - name: Build website
        working-directory: website
        run: npm run build

      - name: Save PR metadata
        run: |
          mkdir -p ./pr-meta
          echo "${{ github.event.number }}" > ./pr-meta/pr-number.txt

      - name: Upload built site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.2
        with:
          name: docs-preview-site
          path: |
            website/out
            website/.next
            website/public
          if-no-files-found: error

      - name: Verify generated website
        run: |
          test -s website/out/index.html
          test -s website/out/docs/tools/generator.html || \
          test -s website/out/docs/tools/generator/index.html
          
      - name: Upload PR metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.2
        with:
          name: docs-preview-pr-meta
          path: ./pr-meta
