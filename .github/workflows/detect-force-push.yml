# Purpose of this workflow is to flag pull requests whose commit history was
# rewritten via force-push, helping reviewers spot replaced commits and inspect
# what changed.
#
# Why pull_request_target instead of pull_request: the workflow must add labels
# and post/update a comment on PRs opened from forks, and the plain `pull_request`
# event only grants a read-only token for forks.
#
# Security: safe because there is NO checkout and NO PR code execution — only
# commit SHAs and sender metadata are read via GitHub REST APIs.
name: Detect force-push on PR

on:
  pull_request_target:
    types:
      - synchronize # zizmor: ignore[dangerous-triggers] no checkout; API-only comparison of before/after SHAs

permissions: {}

jobs:
  detect-force-push:
    name: Detect force-push on PR
    if: ${{ !contains(fromJson('["asyncapi-bot", "dependabot[bot]", "dependabot-preview[bot]", "github-actions[bot]"]'), github.event.pull_request.user.login) }} # zizmor: ignore[obfuscation]
    runs-on: ubuntu-latest
    permissions:
      contents: read # required by repos.compareCommitsWithBasehead
      pull-requests: write # required to add 'force-pushed' label and post/update the summary comment
    steps:
      - name: Check if push rewrote commit history
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { before, after, pull_request: pr, sender } = context.payload;
            if (!before || !after || before === after) return;

            const { owner, repo } = context.repo;
            let isForcePush = false;
            let compareUnavailable = false;
            let comparisonStatus = '';

            try {
              const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${before}...${after}`,
              });

              // Fast-forward pushes always report 'ahead'; 'diverged' or 'behind' means history was rewritten.
              comparisonStatus = comparison.status;
              isForcePush = comparisonStatus === 'diverged' || comparisonStatus === 'behind';
            } catch (error) {
              // Why: 404 (previous SHA unavailable) or 422 (no common ancestor) indicate rewritten history;
              // any other error (e.g. 5xx) should fail loudly rather than silently passing.
              if (error.status === 404 || error.status === 422) {
                isForcePush = true;
                compareUnavailable = true;
              } else {
                throw error;
              }
            }

            if (!isForcePush) return;

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: pr.number,
              labels: ['force-pushed'],
            });

            const marker = '<!-- detect-force-push -->';
            const timestamp = new Date().toISOString().replace('T', ' ').slice(0, 16) + ' UTC';
            const actor = sender && sender.login ? `@${sender.login}` : 'unknown';
            const shortBefore = before.slice(0, 7);
            const shortAfter = after.slice(0, 7);

            const rewriteType = compareUnavailable
              ? 'Unreachable (`before` unavailable)'
              : comparisonStatus === 'behind'
                ? 'Reset / dropped commits (`behind`)'
                : 'Rewritten (`diverged`)';

            // Why: use two-dot (before..after) rather than three-dot (before...after) so reverted
            // commits still show their exact snapshot diff instead of an empty merge-base diff.
            const diffLink = compareUnavailable
              ? `[Commits](https://github.com/${owner}/${repo}/pull/${pr.number}/commits)`
              : `[Compare](https://github.com/${owner}/${repo}/compare/${before}..${after})`;
            const newRow = `| ${timestamp} | ${actor} | \`${shortBefore}\` → \`${shortAfter}\` | ${rewriteType} | ${diffLink} |`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100,
            });

            // Why: filter by github-actions[bot] so another user quoting the marker cannot break updateComment.
            const existing = comments.find(
              c => c.user && c.user.login === 'github-actions[bot]' && (c.body || '').includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: `${existing.body.trimEnd()}\n${newRow}`,
              });
            } else {
              const body = [
                marker,
                '⚠️ **Force-push detected on this PR**',
                '',
                'Commit history was rewritten. Inspect the snapshot diff below and re-check any collapsed or outdated review comments before approving.',
                '',
                '> **Note for contributors:** Please push incremental commits instead of force-pushing (PRs are squash-merged).',
                '> *(If this force-push included a rebase, the snapshot diff will also include changes from the base branch.)*',
                '',
                '| Time (UTC) | Actor | Before → After | Type | Snapshot diff |',
                '|---|---|---|---|---|',
                newRow,
              ].join('\n');

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body,
              });
            }
