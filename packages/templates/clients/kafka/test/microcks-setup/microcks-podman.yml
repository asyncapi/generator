volumes:
  microcks-data:
  maven-cache:

services:
  # ───────────── infrastructure ─────────────────────
  mongo:
    profiles:
      - infra
      - ci
    image: docker.io/mongo:4.4.29
    container_name: microcks-db
    volumes:
      - microcks-data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 1s
      retries: 3

  kafka:
    profiles:
      - infra
      - ci
    image: docker.io/redpandadata/redpanda:v24.3.1
    container_name: microcks-kafka
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
    ports:
      - 9092:9092
      - 19092:19092
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'echo > /dev/tcp/localhost/19092'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  app:
    profiles:
      - infra
      - ci
    depends_on:
      - mongo
    image: quay.io/microcks/microcks:1.11.2
    container_name: microcks
    volumes:
      - ./config:/deployments/config:Z
    ports:
      - 8080:8080
      - 9090:9090
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017
      SPRING_DATA_MONGODB_DATABASE: microcks
      TEST_CALLBACK_URL: http://microcks:8080
      SERVICES_UPDATE_INTERVAL: "0 0 0/2 * * *"
      KEYCLOAK_ENABLED: "false"
      ASYNC_MINION_URL: http://microcks-async-minion:8081
      KAFKA_BOOTSTRAP_SERVER: kafka:19092
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      start_period: 35s
      interval: 10s
      timeout: 3s
      retries: 3

  async-minion:
    profiles:
      - infra
      - ci
    depends_on:
      app:
        condition: service_healthy
    image: quay.io/microcks/microcks-async-minion:1.11.2
    container_name: microcks-async-minion
    restart: on-failure
    volumes:
      - ./config:/deployments/config:Z
    ports:
      - 8081:8081
    environment:
      QUARKUS_PROFILE: docker-compose
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/q/health/ready"]
      start_period: 10s
      interval: 10s
      timeout: 2s
      retries: 3

  importer:
    profiles:
      - infra
      - ci
    image: quay.io/microcks/microcks-cli:0.5.8
    container_name: microcks-cli-importer
    working_dir: /usr/src/app
    volumes:
      - ../:/usr/src/app
    depends_on:
      app:
        condition: service_healthy
    command: >-
      microcks-cli import __fixtures__/asyncapi-adeo.yml
      --microcksURL=http://microcks:8080/api
      --keycloakClientId=microcks-serviceaccount
      --keycloakClientSecret=ab54d329-e435-41ae-a900-ec6b3fe15c54

  tester-java:
    profiles:
      - test-java
    image: maven:3.9-eclipse-temurin-21
    container_name: kafka-acceptance-tester-java
    ports:
      - "8085:8085"
    working_dir: /usr/src/app
    volumes:
      - maven-cache:/root/.m2
      - ../../../../../../:/usr/src/app
    command: ["sh", "-c", "cd packages/templates/clients/kafka/java/quarkus/test/temp/snapshotTestResult/client_adeo && mvn clean install -DskipTests && cd ../../../../../../test/java/quarkus && mvn clean test"]
